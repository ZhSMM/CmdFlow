[package]
name = "cmdflow"
version = "0.2.0"
description = "本地命令编排工具"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cmdflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-shell = "2.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tokio-util = "0.7"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rhai = "1"
cron = "0.12"
keyring = "2"

# JS plugin runtime (Boa engine, pure Rust)
boa_engine = "0.20"

# WASM plugin runtime (wasmtime) — 禁用 cache 避免 toml 版本冲突
wasmtime = { version = "24", default-features = false, features = ["runtime", "std", "cranelift"] }

# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# 通用
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wat = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

[package.metadata]
# Tauri 2 build script metadata
# 文档: https://v2.tauri.app/reference/config/

