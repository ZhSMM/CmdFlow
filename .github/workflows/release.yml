name: Release

# 发布流水线: 推送 v*.*.* tag 触发(或手动 workflow_dispatch)
# 跨平台构建 Tauri 应用 (Windows / Linux / macOS)
# 把产物上传到 GitHub Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: msi + nsis
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          # Linux: deb + appimage
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          # macOS (Intel)
          - platform: macos-13
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # macOS (Apple Silicon)
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v1
        with:
          cache-on-failure: true
          working-directory: src-tauri
          target-dir: target

      # ===== 平台特定依赖 =====
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve esbuild build
        run: pnpm rebuild esbuild

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "CmdFlow ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            ## CmdFlow ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

            详见 [README](https://github.com/${{ github.repository }}#readme) 和 [更新日志](https://github.com/${{ github.repository }}/blob/main/RELEASE_NOTES.md)。

            ### 主要功能

            - 命令库 + 拖拽改分类 (dnd-kit)
            - DAG 工作流 (可视化编排 + 模板市场)
            - 多窗口启动器 (Ctrl+Alt+P)
            - JS 插件 (Boa engine) + WASM 插件 (wasmtime)
            - AI 节点: 流式输出 + 工具调用
            - 调度 (cron) + 历史 + 收藏
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ===== 验证 Release 创建成功 =====
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    needs: build-tauri
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub Release exists
        run: |
          echo "✅ Release ${{ github.ref_name }} 创建成功"
          gh release view ${{ github.ref_name }} --json name,tagName,assets | jq .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
